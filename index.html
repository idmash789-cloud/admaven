<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Secure connection confirmation. You will be redirected automatically, or choose Next or Close.">
<meta name="theme-color" content="#0f172a">
<title>Security Confirmation</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --emerald: #0e7a5f;
    --emerald-soft: #ecfdf5;
    --gold: #c2a25a;
    --card-shadow: 0 24px 60px rgba(15, 23, 42, 0.22), 0 2px 10px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
  }
  a:focus-visible { outline: 3px solid var(--emerald); outline-offset: 3px; border-radius: 8px; }

  /* Dimmed, softly blurred background behind the pop-up */
  .overlay {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    background: rgba(15, 23, 42, 0.45);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  .popup {
    position: relative;
    width: min(100%, 460px);
    margin: auto;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    text-align: center;
    padding: clamp(28px, 7vw, 40px) clamp(20px, 5.5vw, 36px) clamp(22px, 5vw, 28px);
    animation: rise 0.5s ease both;
  }
  /* Elegant hairline accent across the top of the card */
  .popup::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--emerald), var(--gold));
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .close-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #f8fafc;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 22px;
    line-height: 1;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-x:hover { background: #f1f5f9; color: var(--ink); }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 6px 0 18px;
  }
  .shield {
    width: 76px;
    height: 76px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ecfdf5, #d1fae5);
    border: 1px solid #a7f3d0;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse-ring 2.6s ease-out infinite;
  }
  .shield svg { width: 38px; height: 38px; }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(14, 122, 95, 0.18); }
    70% { box-shadow: 0 0 0 14px rgba(14, 122, 95, 0); }
    100% { box-shadow: 0 0 0 0 rgba(14, 122, 95, 0); }
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(24px, 6.5vw, 31px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .lead {
    font-size: clamp(15px, 4vw, 16px);
    line-height: 1.65;
    color: var(--muted);
    max-width: 34ch;
    margin: 0 auto 16px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--emerald-soft);
    color: var(--emerald);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 7px 13px;
    border-radius: 999px;
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 22px 0 20px;
  }

  .countdown-label { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .countdown-label strong { color: var(--ink); font-weight: 700; }
  .countdown-number {
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 10vw, 44px);
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .countdown-number.pop { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1.08); opacity: 0.55; }
    100% { transform: scale(1); opacity: 1; }
  }
  .countdown-unit {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 14px;
  }
  .progress-track {
    height: 6px;
    background: #eef2f7;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--emerald), #14b8a6);
    border-radius: 999px;
    animation: shrink 5s linear forwards;
  }
  @keyframes shrink {
    from { width: 100%; }
    to { width: 0%; }
  }

  .buttons { display: grid; gap: 12px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-next { background: var(--ink); color: #ffffff; }
  .btn-next:hover { background: #1e293b; }
  .btn-close { background: #ffffff; color: var(--ink); border: 1px solid #cbd5e1; }
  .btn-close:hover { background: #f8fafc; border-color: #94a3b8; }

  .note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--faint);
    margin-top: 18px;
  }

  /* Small phones: tighter spacing, still comfortable tap targets */
  @media (max-width: 380px) {
    .popup { border-radius: 18px; padding: 26px 18px 20px; }
    .shield { width: 64px; height: 64px; margin-bottom: 14px; }
    .shield svg { width: 32px; height: 32px; }
    .divider { margin: 18px 0 16px; }
    .btn { min-height: 50px; font-size: 15px; }
  }

  /* Tablets and desktop: side-by-side buttons, roomier card */
  @media (min-width: 560px) {
    .popup { width: min(100%, 480px); border-radius: 22px; }
    .buttons { grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .popup, .shield, .countdown-number.pop { animation: none; }
  }
</style>
</head>
<body>
  <div class="overlay">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <a class="close-x" href="https://certainlywhen.com?abigc=1146487" aria-label="Close" data-cancel-countdown>&times;</a>

      <p class="eyebrow">Security Check</p>

      <div class="shield" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5.5V11C4 16.5 7.5 20.5 12 22C16.5 20.5 20 16.5 20 11V5.5L12 2Z" fill="#0e7a5f" fill-opacity="0.12" stroke="#0e7a5f" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M8.5 12L11 14.5L15.5 10" stroke="#0e7a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 id="popup-title">Secure Connection</h1>
      <p class="lead">Your network has been checked and this site is safe to continue.</p>

      <div class="status"><span class="dot"></span> Check complete &middot; Secure</div>

      <div class="divider" aria-hidden="true"></div>

      <div class="countdown" aria-live="polite">
        <p class="countdown-label">Redirecting automatically</p>
        <div class="countdown-number" id="countdown-number">5</div>
        <p class="countdown-unit">seconds</p>
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>

      <div class="buttons">
        <a class="btn btn-next" href="https://certainlywhen.com?nmbi6=1146582" data-cancel-countdown>Next <span aria-hidden="true">&rarr;</span></a>
        <a class="btn btn-close" href="https://certainlywhen.com?abigc=1146487" data-cancel-countdown>Close</a>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var secondsLeft = 10;
      var numberEl = document.getElementById('countdown-number');
      var timer = setInterval(function () {
        secondsLeft -= 1;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          window.location.href = 'https://certainlywhen.com?bzi7t=1145440';
          return;
        }
        numberEl.textContent = secondsLeft;
        numberEl.classList.remove('pop');
        void numberEl.offsetWidth; // restart the pop animation
        numberEl.classList.add('pop');
      }, 1000);

      // Clicking Next or Close cancels the auto-redirect so the chosen link wins.
      document.querySelectorAll('[data-cancel-countdown]').forEach(function (el) {
        el.addEventListener('click', function () { clearInterval(timer); });
      });
    })();
  </script>
</body>
</html>
